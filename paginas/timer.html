    <main class="mainTimer">

        <!-- ===== VISTA 1: CONFIGURACIÓN ===== -->
        <div id="vistaConfig" class="timer">

            <div class="panelTiempos">

                <div class="grupoTiempos">
                    <span class="grupoTiempos-titulo">Entrenamiento</span>

                    <div class="filaTiempo">
                        <div class="filaTiempo-info">
                            <i class="fa-solid fa-fire filaTiempo-icono"></i>
                            <span class="filaTiempo-label">Entrenar (seg)</span>
                        </div>
                        <div class="stepper">
                            <button type="button" class="stepper-btn" data-target="entrenar" data-step="-5">−</button>
                            <input type="number" id="entrenar" value="0" class="stepper-input" inputmode="numeric">
                            <button type="button" class="stepper-btn" data-target="entrenar" data-step="5">+</button>
                        </div>
                    </div>

                    <div class="filaTiempo">
                        <div class="filaTiempo-info">
                            <i class="fa-solid fa-repeat filaTiempo-icono"></i>
                            <span class="filaTiempo-label">Rondas</span>
                        </div>
                        <div class="stepper">
                            <button type="button" class="stepper-btn" data-target="rondas" data-step="-1">−</button>
                            <input type="number" id="rondas" value="0" class="stepper-input" inputmode="numeric">
                            <button type="button" class="stepper-btn" data-target="rondas" data-step="1">+</button>
                        </div>
                    </div>
                </div>

                <div class="grupoTiempos">
                    <span class="grupoTiempos-titulo">Descanso</span>

                    <div class="filaTiempo">
                        <div class="filaTiempo-info">
                            <i class="fa-solid fa-mug-hot filaTiempo-icono"></i>
                            <span class="filaTiempo-label">Entre rondas (seg)</span>
                        </div>
                        <div class="stepper">
                            <button type="button" class="stepper-btn" data-target="descansar" data-step="-5">−</button>
                            <input type="number" id="descansar" value="0" class="stepper-input" inputmode="numeric">
                            <button type="button" class="stepper-btn" data-target="descansar" data-step="5">+</button>
                        </div>
                    </div>

                    <div class="filaTiempo">
                        <div class="filaTiempo-info">
                            <i class="fa-solid fa-layer-group filaTiempo-icono"></i>
                            <span class="filaTiempo-label">Ciclos</span>
                        </div>
                        <div class="stepper">
                            <button type="button" class="stepper-btn" data-target="ciclos" data-step="-1">−</button>
                            <input type="number" id="ciclos" value="0" class="stepper-input" inputmode="numeric">
                            <button type="button" class="stepper-btn" data-target="ciclos" data-step="1">+</button>
                        </div>
                    </div>

                    <div class="filaTiempo">
                        <div class="filaTiempo-info">
                            <i class="fa-solid fa-hourglass-half filaTiempo-icono"></i>
                            <span class="filaTiempo-label">Entre ciclos (seg)</span>
                        </div>
                        <div class="stepper">
                            <button type="button" class="stepper-btn" data-target="descansarCiclo"
                                data-step="-5">−</button>
                            <input type="number" id="descansarCiclo" value="0" class="stepper-input"
                                inputmode="numeric">
                            <button type="button" class="stepper-btn" data-target="descansarCiclo"
                                data-step="5">+</button>
                        </div>
                    </div>
                </div>

                <input type="hidden" id="preparate" value="3">
            </div>

            <div class="botonesTimer botonesConfig">
                <button id="predefinido" class="estiloBtn estiloBtnSecundario">
                    <i class="fa-solid fa-bolt" style="color: #f3f3f1;"></i> TIMER PREDEFINIDO
                </button>
                <button id="empezar" class="estiloBtn">
                    <i class="fa-solid fa-play" style="color: #ffffff;"></i> EMPEZAR
                </button>
            </div>
        </div>

        <!-- ===== VISTA 2: CRONÓMETRO ===== -->
        <div id="vistaCronometro" class="timer vista-oculta">

            <button id="volver" class="btnVolver">
                <i class="fa-solid fa-arrow-left"></i> EDITAR / VOLVER
            </button>

            <h1 id="estado" class="estados estadoGrande"> PREPÁRATE </h1>
            <div id="tiempo" class="tiempo tiempoGrande">00:00</div>

            <div class="botonesTimer">
                <button id="pausar" class="estiloBtn"> <i class="fa-solid fa-pause" style="color: #f3f3f1;"></i>
                    PAUSAR</button>
                <button id="restablecer" class="estiloBtn"><i class="fa-solid fa-arrows-rotate"
                        style="color: #fafafa;"></i> RESTABLECER</button>
            </div>
        </div>
